<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TFT Twitch Extension Overlay</title>
  <link rel="stylesheet" href="./styles/index.css">
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
</head>
<body>
  <div id="overlay-root">
    <!-- Left HUD Panel: Bench & Active Traits -->
    <div id="hud-left" class="hud-panel-left">
      <div class="panel-header">
        <span class="panel-title">Inventory & Traits</span>
        <button id="left-close-btn" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">✕</button>
      </div>
      <div class="toggle-tab-group">
        <button class="toggle-tab-btn active" data-left-tab="bench">Bench Items</button>
        <button class="toggle-tab-btn" data-left-tab="traits">Active Traits</button>
      </div>
      <div class="panel-body">
        <div id="tab-bench-content" class="bench-grid"></div>
        <div id="tab-traits-content" class="traits-list" style="display:none;"></div>
      </div>
    </div>

    <!-- Right HUD Panel: Combat Damage & Lobby Scoreboard -->
    <div id="hud-right" class="hud-panel-right">
      <div class="panel-header">
        <span class="panel-title">Combat & Lobby</span>
        <button id="right-close-btn" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">✕</button>
      </div>
      <div class="toggle-tab-group">
        <button class="toggle-tab-btn active" data-right-tab="damage">Damage Meter</button>
        <button class="toggle-tab-btn" data-right-tab="lobby">Lobby Scoreboard</button>
      </div>
      <div class="panel-body">
        <div id="tab-damage-content" style="display:flex; flex-direction:column; gap:8px;"></div>
        <div id="tab-lobby-content" style="display:none;"></div>
      </div>
    </div>

    <!-- Rich Tooltip Container -->
    <div id="tft-tooltip" class="tft-tooltip">
      <div class="tooltip-title" id="tooltip-title"></div>
      <div class="tooltip-desc" id="tooltip-desc"></div>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
